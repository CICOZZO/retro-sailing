<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAILING (1982 - Wind Productions) - An Adventure in the Bermuda Triangle</title>
  <link rel="stylesheet" href="css/v1-dynetron.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Barra de Alternância de Versão -->
  <div class="version-nav-bar">
    <span class="active-tag">&#9670; YOU ARE PLAYING: VERSION 1 (WIND PRODUCTIONS 1982 - CGA)</span>
    <a href="versao2.html" class="switch-btn">SWITCH TO VERSION 2 (3D WIREFRAME 1986) &#9654;</a>
  </div>

  <!-- Gabinete do Monitor Retrô PC-XT -->
  <div class="monitor-frame">
    <div class="bezel-header">
      <span>IBM PC / PC-XT // CGA MODE 4 (320x200 PALETTE 0)</span>
      <span>WIND PRODUCTIONS &copy; 1982</span>
    </div>

    <!-- Tubo CRT de Imagem com os 3 Quadrantes -->
    <div class="crt-tube">
      <canvas id="v1GameCanvas" width="320" height="200"></canvas>
    </div>

    <!-- Barra de Atalhos de Teclado / Menu Rápido -->
    <div class="quick-action-bar">
      <div>
        <button class="quick-btn" id="btnV1Begin">[B] BEGIN</button>
        <button class="quick-btn" id="btnV1Practice">[P] PRACTICE</button>
        <button class="quick-btn" id="btnV1Obj">[O] OBJECTIVE</button>
        <button class="quick-btn" id="btnV1Controls">[C] CONTROLS</button>
        <button class="quick-btn" id="btnV1Scoring">[S] SCORING</button>
        <button class="quick-btn" id="btnV1Hazards">[H] HAZARDS</button>
        <button class="quick-btn" id="btnV1Gauges">[G] GAUGES</button>
      </div>
      <div>
        <button class="quick-btn" id="btnV1Space">[SPACE] CONTINUE</button>
      </div>
    </div>

    <!-- Controles na tela (equivalem ao teclado numérico) -->
    <div class="touch-bar">
      <button class="t-v1-btn" id="v1PadLeft">&larr; 4 PORT</button>
      <button class="t-v1-btn" id="v1PadCenter">5 CENTER</button>
      <button class="t-v1-btn" id="v1PadRight">6 STBD &rarr;</button>
      <button class="t-v1-btn" id="v1PadIn">2 SHEET IN</button>
      <button class="t-v1-btn" id="v1PadOut">8 SHEET OUT</button>
      <button class="t-v1-btn" id="v1PadEngine">E ENGINE</button>
    </div>

  <!-- Scripts da Versão 1 -->
  <script src="js/v1/v1-cga.js?v=4"></script>
  <script src="js/v1/v1-audio.js?v=4"></script>
  <script src="js/v1/v1-map.js?v=4"></script>
  <script src="js/v1/v1-boat.js?v=4"></script>
  <script src="js/v1/v1-render.js?v=4"></script>
  <script src="js/v1/v1-game.js?v=4"></script>
  <script src="js/v1/v1-main.js?v=4"></script>
</body>
</html>
